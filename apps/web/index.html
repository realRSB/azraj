    <!--
      Decorative cloud background. Both scripts are version-pinned and
      integrity-checked: this page also handles phone-login codes, so a
      compromised CDN (or an unreviewed upstream release, which `vanta@latest`
      would have pulled in automatically) would otherwise get full DOM access
      to the auth flow. SRI makes the browser refuse any bytes that don't match
      the hash; crossorigin="anonymous" is required for SRI to apply here.
      When bumping a version you must recompute the hash:
        curl -sS <url> | openssl dgst -sha384 -binary | openssl base64 -A
    -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"
      integrity="sha384-9EQoUIJYrv09/oYhSxnw1VpLcfPw3BM9dE7+D/3wGUPeLLa7F9Z6OAoD+i/M6FK9"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.clouds.min.js"
      integrity="sha384-1taX5yEk+ymUOq1idyE+buIpKOZz94Xz/nz4iRxF0OCv/ppmRhun994ocCLRtaUR"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
